<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Security Dashboard Login</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            background: #eef2f6;
            color: #17202a;
            font-family: Arial, Helvetica, sans-serif;
        }

        main {
            width: min(380px, calc(100vw - 32px));
            padding: 24px;
            background: #ffffff;
            border: 1px solid #d9e1ea;
            border-radius: 8px;
        }

        h1 {
            margin: 0 0 18px;
            font-size: 22px;
            line-height: 1.25;
        }

        label {
            display: grid;
            gap: 6px;
            margin-bottom: 14px;
            color: #617084;
            font-size: 14px;
            font-weight: 700;
        }

        input {
            width: 100%;
            height: 42px;
            padding: 0 12px;
            border: 1px solid #c9d4e1;
            border-radius: 8px;
            color: #17202a;
            font-size: 15px;
        }

        button {
            width: 100%;
            height: 42px;
            border: 0;
            border-radius: 8px;
            background: #175cd3;
            color: #ffffff;
            cursor: pointer;
            font-size: 15px;
            font-weight: 700;
        }

        .error {
            min-height: 20px;
            margin: 0 0 12px;
            color: #b42318;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <main>
        <h1>Security Dashboard</h1>
        <p class="error">{{ error or "" }}</p>
        <form method="post">
            <label>
                Username
                <input name="username" autocomplete="username" required>
            </label>
            <label>
                Password
                <input name="password" type="password" autocomplete="current-password" required>
            </label>
            <button type="submit">Log in</button>
        </form>
    </main>
</body>
</html>
